version: 2

updates:
  - package-ecosystem: pnpm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Africa/Johannesburg"

    open-pull-requests-limit: 10

    labels:
      - dependencies

    commit-message:
      prefix: chore
      include: scope

    groups:
      production-dependencies:
        dependency-type: production

      development-dependencies:
        dependency-type: development
